<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lift Lab Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161e2e;
      --input-bg: #0b0f19;
      --accent: #38bdf8;
      --accent-text: #0b0f19;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --danger: #ef4444;
      --border-color: rgba(100, 116, 139, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif; }
    html, body { height: 100dvh; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; }
    #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: var(--bg-color); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .pin-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; width: 100%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    .pin-title { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
    .pin-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 16px; }
    label { display: block; text-align: left; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 0.9rem; margin-bottom: 12px; outline: none; text-align: center; }
    input:focus { border-color: var(--accent); }
    button.btn-primary { background: var(--accent); color: var(--accent-text); padding: 12px; border-radius: 8px; border: none; font-weight: 700; width: 100%; cursor: pointer; }
    header { padding: 10px 16px; text-align: center; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-shrink: 0; padding-top: calc(env(safe-area-inset-top) + 6px); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.05rem; font-weight: 800; color: var(--accent); text-transform: uppercase; }
    .user-badge { font-size: 0.7rem; background: var(--input-bg); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color); color: var(--text-muted); }
    .container { flex: 1; padding: 12px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 14px; border: 1px solid var(--border-color); margin-bottom: 12px; }
    select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); margin-bottom: 10px; outline: none; }
    #admin-panel-btn { display: none; background: #f59e0b; color: #000; margin-top: 10px; font-weight: 800; }
  </style>
</head>
<body>
  <div id="auth-screen">
    <div class="pin-card">
      <div class="pin-title">Lift Lab Test</div>
      <div class="pin-subtitle">Введи имя/никнейм и ПИН-код</div>
      <label style="text-align: center;">Твое имя / Никнейм</label>
      <input type="text" id="user-nickname-input" placeholder="Например: Иван (Тест)">
      <label style="text-align: center;">ПИН-код</label>
      <input type="password" id="user-pin-input" placeholder="****" maxlength="6">
      <button class="btn-primary" onclick="handleAuth()">Войти / Зарегистрироваться</button>
      <div id="auth-error" style="color: var(--danger); font-size: 0.75rem; margin-top: 8px; display: none;"></div>
    </div>
  </div>

  <header>
    <h1>Lift Lab</h1>
    <div class="user-badge" id="current-user-badge">Аноним</div>
  </header>

  <div class="container">
    <div class="card">
      <h2 style="font-size:0.9rem; margin-bottom:10px;">Запись подходов</h2>
      <label>Упражнение</label>
      <select id="exercise-select">
        <option value="Приседания">Приседания</option>
        <option value="Жим лежа">Жим лежа</option>
        <option value="Тяга блока">Тяга блока</option>
      </select>
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>Вес (кг)</label>
          <input type="number" id="input-weight" placeholder="60" style="text-align:left;">
        </div>
        <div style="flex:1;">
          <label>Повторы</label>
          <input type="number" id="input-reps" placeholder="10" style="text-align:left;">
        </div>
      </div>
      <button class="btn-primary" onclick="saveSet()">Сохранить подход</button>
      <button id="admin-panel-btn" onclick="alert('Вы вошли в режим Администратора. Вся статистика доступна в вашей Google Таблице!')">👑 Вход Администратора (God Mode)</button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const tgUsername = tg.initDataUnsafe?.user?.first_name || tg.initDataUnsafe?.user?.username;
      if (tgUsername) {
        document.getElementById('user-nickname-input').value = tgUsername;
      }
    }

    let currentUser = null;

    function handleAuth() {
      const nameInput = document.getElementById('user-nickname-input').value.trim();
      const pinInput = document.getElementById('user-pin-input').value.trim();
      const errorDiv = document.getElementById('auth-error');

      if (!nameInput || !pinInput) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Укажите имя и ПИН-код';
        return;
      }

      errorDiv.style.display = 'none';

      // Проверка на мастер-коды админа (1-9999, 1999 или 9999)
      const isAdmin = (pinInput === "1-9999" || pinInput === "1999" || pinInput === "9999");
      const adminName = isAdmin ? "Администратор (Ты)" : nameInput;

      currentUser = {
        name: adminName,
        pin: pinInput,
        role: isAdmin ? "admin" : "tester"
      };

      localStorage.setItem('gym_user_name', adminName);
      localStorage.setItem('gym_user_pin', pinInput);

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('current-user-badge').innerText = currentUser.name;

      if (isAdmin) {
        document.getElementById('admin-panel-btn').style.display = 'block';
      }

      sendTelemetry('log_activity', { event: 'Вход / Динамическая регистрация' });
    }

    function sendTelemetry(action, payload = {}) {
      if (!GOOGLE_SCRIPT_URL || !currentUser) return;
      const data = { action, userId: currentUser.pin, username: currentUser.name, ...payload };
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).catch(err => console.error('Ошибка:', err));
    }

    function saveSet() {
      const exercise = document.getElementById('exercise-select').value;
      const weight = parseFloat(document.getElementById('input-weight').value) || 0;
      const reps = parseInt(document.getElementById('input-reps').value) || 0;

      if (!weight || !reps) return alert('Заполните вес и повторы');

      sendTelemetry('log_workout', { exercise, weight, reps, setType: 'WORK', isPR: false });
      alert('Подход сохранен!');
    }

    window.onload = function() {
      const savedName = localStorage.getItem('gym_user_name');
      const savedPin = localStorage.getItem('gym_user_pin');
      if (savedName && savedPin) {
        document.getElementById('user-nickname-input').value = savedName;
        document.getElementById('user-pin-input').value = savedPin;
        handleAuth();
      }
    };
  </script>
</body>
</html>
