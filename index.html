<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lift Lab Bot</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Внешние библиотеки -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/build/vanilla-calendar.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro/build/vanilla-calendar.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161e2e;
      --input-bg: #0b0f19;
      --accent: #38bdf8;
      --accent-text: #0b0f19;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --danger: #ef4444;
      --border-color: rgba(100, 116, 139, 0.3);
    }

    [data-theme="emerald-luxe"] {
      --bg-color: #07150e; --card-bg: #10251a; --input-bg: #0a1b12; --accent: #22c55e; --accent-text: #052e16; --text-main: #f0fdf4; --border-color: #28543a;
    }
    [data-theme="white-clean"] {
      --bg-color: #f3f6f4; --card-bg: #ffffff; --input-bg: #f7faf8; --accent: #16834a; --accent-text: #ffffff; --text-main: #17251c; --border-color: #d8e2db;
    }
    [data-theme="obsidian-gold"] {
      --bg-color: #0d0d0d; --card-bg: #1a1a1a; --input-bg: #0d0d0d; --accent: #f59e0b; --accent-text: #000000; --text-main: #fef3c7; --border-color: rgba(245, 158, 11, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif; }
    
    html, body {
      height: 100dvh; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column;
    }

    /* Auth Overlay */
    #auth-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: var(--bg-color); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .pin-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; width: 100%; max-width: 320px; text-align: center;
    }
    .pin-title { font-size: 1.2rem; font-weight: 800; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
    .pin-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 16px; }

    label { display: block; text-align: left; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
    input, select {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 0.9rem; margin-bottom: 12px; outline: none;
    }

    header {
      padding: 10px 16px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-shrink: 0; padding-top: calc(env(safe-area-inset-top) + 6px); display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.05rem; font-weight: 800; color: var(--accent); text-transform: uppercase; }
    .user-badge { font-size: 0.7rem; background: var(--input-bg); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color); color: var(--text-muted); }

    .container { flex: 1; padding: 10px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .tab-content { display: none; height: 100%; flex-direction: column; gap: 8px; }
    .tab-content.active { display: flex; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 12px; border: 1px solid var(--border-color); flex-shrink: 0; }
    .card h2 { font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); text-transform: uppercase; }
    .card-scrollable { flex: 1; overflow-y: auto; min-height: 0; }

    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }

    .subtabs { display: flex; gap: 4px; background: var(--input-bg); padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 8px; }
    .subtabs button { flex: 1; padding: 6px 0; font-size: 0.7rem; border-radius: 6px; background: none; color: var(--text-muted); border: none; font-weight: 700; cursor: pointer; }
    .subtabs button.active { background: var(--card-bg); color: var(--accent); border: 1px solid var(--border-color); }

    button { width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-success { background: var(--accent-green); color: #fff; }

    .set-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 6px; font-size: 0.8rem; }
    
    #settings-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: rgba(0, 0, 0, 0.7); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
    #settings-modal.active { display: flex; }

    nav { background: var(--card-bg); display: flex; border-top: 1px solid var(--border-color); padding-bottom: calc(env(safe-area-inset-bottom) + 4px); flex-shrink: 0; }
    nav button { background: none; color: var(--text-muted); border-radius: 0; padding: 8px 0 4px 0; font-size: 0.65rem; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 600; text-transform: uppercase; }
    nav button.active { color: var(--accent); }
    nav button svg { width: 18px; height: 18px; fill: currentColor; }
  </style>
</head>
<body>

  <!-- Auth Overlay -->
  <div id="auth-screen">
    <div class="pin-card">
      <div class="pin-title">Lift Lab</div>
      <div class="pin-subtitle">Введите ваше имя и ПИН-код</div>
      <label style="text-align:center;">Имя / Никнейм</label>
      <input type="text" id="user-nickname-input" style="text-align:center;">
      <label style="text-align:center;">ПИН-код</label>
      <input type="password" id="user-pin-input" placeholder="****" maxlength="6" style="text-align:center;">
      <button class="btn-primary" onclick="handleAuth()">Войти в приложение</button>
      <div id="auth-error" style="color: var(--danger); font-size: 0.75rem; margin-top: 8px; display: none;"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal">
    <div class="pin-card" style="max-width: 360px; text-align: left;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="font-size: 1rem; color: var(--accent);">Настройки</h2>
        <button onclick="toggleSettingsModal()" style="width: auto; background: none; color: var(--danger); border: none; font-size: 1.2rem;">&times;</button>
      </div>
      <label>Тема оформления</label>
      <select id="theme-selector" onchange="changeTheme(this.value)">
        <option value="midnight-neon">🌌 Midnight Neon</option>
        <option value="emerald-luxe">🌿 Emerald Luxe</option>
        <option value="white-clean">☀️ White Clean</option>
        <option value="obsidian-gold">👑 Obsidian Gold</option>
      </select>
      <button id="admin-panel-btn" style="display:none; background:#f59e0b; color:#000; margin-top:10px; font-weight:800;" onclick="alert('Режим Администратора активен. Таблица Google подключена!')">👑 God Mode (Админ)</button>
      <button class="btn-primary" style="margin-top:10px;" onclick="exportData()">💾 Экспорт бэкапа</button>
      <div style="font-size:0.65rem; color:var(--text-muted); text-align:center; margin-top:12px;">Lift Lab v1.0.42</div>
    </div>
  </div>

  <header>
    <h1>Lift Lab</h1>
    <div class="user-badge" id="current-user-badge">Гость</div>
    <button onclick="toggleSettingsModal()" style="width:auto; background:none; color:var(--accent); font-size:1.2rem; padding:0 4px;">⚙️</button>
  </header>

  <div class="container">
    <!-- Tab 1: Workout -->
    <section id="tab-workout" class="tab-content active">
      <div class="card">
        <h2>Запись подхода</h2>
        <label>Упражнение</label>
        <select id="exercise-select">
          <option value="Приседания в Смите">Приседания в Смите</option>
          <option value="Жим груди в блоке">Жим груди в блоке</option>
          <option value="Тяга вертикальная">Тяга вертикальная</option>
          <option value="Подъем штанги на бицепс">Подъем штанги на бицепс</option>
          <option value="Жим гантелей лежа">Жим гантелей лежа</option>
        </select>
        <div class="row">
          <div>
            <label>Тип</label>
            <select id="set-type-select">
              <option value="WORK">Рабочий</option>
              <option value="WARMUP">Разминка</option>
              <option value="DROP">Дроп-сет</option>
            </select>
          </div>
          <div>
            <label>Вес (кг)</label>
            <input type="number" id="input-weight" placeholder="60">
          </div>
          <div>
            <label>Повторы</label>
            <input type="number" id="input-reps" placeholder="10">
          </div>
        </div>
        <button class="btn-primary" onclick="saveSet()">Сохранить подход</button>
      </div>

      <div class="card card-scrollable">
        <h2>Сегодняшняя тренировка</h2>
        <div id="today-sets-list"></div>
      </div>
    </section>

    <!-- Tab 2: Calendar -->
    <section id="tab-calendar" class="tab-content">
      <div class="card card-scrollable">
        <h2>📅 Календарь тренировок</h2>
        <div id="calendar" style="margin-top:10px;"></div>
      </div>
    </section>

    <!-- Tab 3: Progress -->
    <section id="tab-progress" class="tab-content">
      <div class="subtabs">
        <button id="subtab-analytics-btn" class="active" onclick="switchSubtab('analytics')">📊 Аналитика</button>
        <button id="subtab-records-btn" onclick="switchSubtab('records')">🏆 Рекорды (PR)</button>
      </div>

      <div id="subtab-analytics" class="card card-scrollable">
        <h2>Объем по дням</h2>
        <canvas id="volumeChart" style="max-height: 200px; width:100%;"></canvas>
      </div>

      <div id="subtab-records" class="card card-scrollable" style="display:none;">
        <h2>Личные рекорды (1RM)</h2>
        <div id="records-list"></div>
      </div>
    </section>

    <!-- Tab 4: Body -->
    <section id="tab-body" class="tab-content">
      <div class="card">
        <h2>⚖️ Замеры тела & КБЖУ</h2>
        <div class="row">
          <div>
            <label>Вес тела (кг)</label>
            <input type="number" id="body-weight-input" placeholder="71.7" step="0.1">
          </div>
          <div>
            <label>Калории (ккал)</label>
            <input type="number" id="body-kcal-input" placeholder="2500">
          </div>
        </div>
        <button class="btn-success" onclick="saveBodyData()">Сохранить замер</button>
      </div>
      <div class="card card-scrollable">
        <h2>История замеров</h2>
        <div id="body-history-list"></div>
      </div>
    </section>
  </div>

  <nav>
    <button id="nav-workout" class="active" onclick="switchTab('workout')">
      <svg viewBox="0 0 24 24"><path d="M6 5v14h2V5H6zm10 0v14h2V5h-2zM2 9v6h2V9H2zm18 0v6h2V9h-2zM9 11v2h6v-2H9z"/></svg>
      Зал
    </button>
    <button id="nav-calendar" onclick="switchTab('calendar')">
      <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
      Календарь
    </button>
    <button id="nav-progress" onclick="switchTab('progress')">
      <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      Прогресс
    </button>
    <button id="nav-body" onclick="switchTab('body')">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8 z"/></svg>
      Замеры
    </button>
  </nav>

  <script>
    const GOOGLE_SCRIPT_URL = ""; 

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let currentUser = null;
    let workoutSets = JSON.parse(localStorage.getItem('gym_workout_sets') || '[]');
    let bodyRecords = JSON.parse(localStorage.getItem('gym_body_records') || '[]');
    let chartInstance = null;

    function handleAuth() {
      const nameInput = document.getElementById('user-nickname-input').value.trim();
      const pinInput = document.getElementById('user-pin-input').value.trim();
      const errorDiv = document.getElementById('auth-error');

      if (!nameInput || !pinInput) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Укажите имя и ПИН-код';
        return;
      }

      errorDiv.style.display = 'none';
      const isAdmin = (pinInput === "1-9999" || pinInput === "1999" || pinInput === "9999");
      const adminName = isAdmin ? "Администратор (Ты)" : nameInput;

      currentUser = { name: adminName, pin: pinInput, role: isAdmin ? "admin" : "tester" };
      localStorage.setItem('gym_user_name', adminName);
      localStorage.setItem('gym_user_pin', pinInput);

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('current-user-badge').innerText = currentUser.name;

      if (isAdmin) document.getElementById('admin-panel-btn').style.display = 'block';

      renderAll();
      sendTelemetry('log_activity', { event: 'Авторизация' });
    }

    function renderAll() {
      renderTodaySets();
      renderBodyHistory();
      renderRecords();
      initChart();
      initCalendar();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      document.getElementById(`nav-${tab}`).classList.add('active');
      
      if (tab === 'progress') initChart();
      if (tab === 'calendar') initCalendar();
      sendTelemetry('log_activity', { event: 'Переключение вкладки', tab });
    }

    function switchSubtab(subtab) {
      document.getElementById('subtab-analytics').style.display = subtab === 'analytics' ? 'block' : 'none';
      document.getElementById('subtab-records').style.display = subtab === 'records' ? 'block' : 'none';
      document.getElementById('subtab-analytics-btn').classList.toggle('active', subtab === 'analytics');
      document.getElementById('subtab-records-btn').classList.toggle('active', subtab === 'records');
      if (subtab === 'analytics') initChart();
    }

    function saveSet() {
      const exercise = document.getElementById('exercise-select').value;
      const setType = document.getElementById('set-type-select').value;
      const weight = parseFloat(document.getElementById('input-weight').value) || 0;
      const reps = parseInt(document.getElementById('input-reps').value) || 0;

      if (!weight || !reps) return alert('Заполните вес и повторы');

      const setObj = { id: Date.now(), date: new Date().toISOString(), exercise, setType, weight, reps };
      workoutSets.push(setObj);
      localStorage.setItem('gym_workout_sets', JSON.stringify(workoutSets));

      renderTodaySets();
      renderRecords();
      sendTelemetry('log_workout', { exercise, weight, reps, setType });
      
      document.getElementById('input-weight').value = '';
      document.getElementById('input-reps').value = '';
    }

    function renderTodaySets() {
      const container = document.getElementById('today-sets-list');
      const todayStr = new Date().toDateString();
      const todaySets = workoutSets.filter(s => new Date(s.date).toDateString() === todayStr);

      if (todaySets.length === 0) {
        container.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); text-align:center; padding:10px;">Сегодня подходов пока нет</div>';
        return;
      }

      container.innerHTML = todaySets.map(s => `
        <div class="set-item">
          <div><strong>${s.exercise}</strong> <span style="font-size:0.65rem; color:var(--accent);">[${s.setType}]</span></div>
          <div>${s.weight} кг × ${s.reps}</div>
        </div>
      `).join('');
    }

    function renderRecords() {
      const container = document.getElementById('records-list');
      const records = {};
      workoutSets.forEach(s => {
        const oneRM = Math.round(s.weight * (1 + s.reps / 30));
        if (!records[s.exercise] || oneRM > records[s.exercise].oneRM) {
          records[s.exercise] = { weight: s.weight, reps: s.reps, oneRM };
        }
      });

      const keys = Object.keys(records);
      if (keys.length === 0) {
        container.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); text-align:center;">Рекордов пока нет</div>';
        return;
      }

      container.innerHTML = keys.map(k => `
        <div class="set-item">
          <div><strong>${k}</strong><br><span style="font-size:0.65rem; color:var(--text-muted);">Макс: ${records[k].weight}кг × ${records[k].reps}</span></div>
          <div style="color:var(--accent); font-weight:800;">~${records[k].oneRM} кг (1RM)</div>
        </div>
      `).join('');
    }

    function saveBodyData() {
      const weight = parseFloat(document.getElementById('body-weight-input').value) || 0;
      const kcal = parseInt(document.getElementById('body-kcal-input').value) || 0;
      if (!weight && !kcal) return alert('Введите замеры');

      bodyRecords.push({ date: new Date().toISOString(), weight, kcal });
      localStorage.setItem('gym_body_records', JSON.stringify(bodyRecords));
      renderBodyHistory();
      sendTelemetry('log_activity', { event: 'Сохранение замеров', weight, kcal });
      alert('Замер сохранен!');
    }

    function renderBodyHistory() {
      const container = document.getElementById('body-history-list');
      if (bodyRecords.length === 0) {
        container.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); text-align:center;">Замеров нет</div>';
        return;
      }
      container.innerHTML = bodyRecords.slice(-5).reverse().map(b => `
        <div class="set-item">
          <div>${new Date(b.date).toLocaleDateString()}</div>
          <div>${b.weight ? b.weight + ' кг' : ''} ${b.kcal ? '| ' + b.kcal + ' ккал' : ''}</div>
        </div>
      `).join('');
    }

    function initChart() {
      const ctx = document.getElementById('volumeChart');
      if (!ctx) return;
      if (chartInstance) chartInstance.destroy();

      const last7Days = Array.from({length: 7}, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() - (6 - i));
        return d;
      });

      const labels = last7Days.map(d => d.toLocaleDateString('ru-RU', { weekday: 'short' }));
      const data = last7Days.map(d => {
        const dStr = d.toDateString();
        return workoutSets
          .filter(s => new Date(s.date).toDateString() === dStr)
          .reduce((sum, s) => sum + (s.weight * s.reps), 0);
      });

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{ label: 'Объем (кг)', data: data, backgroundColor: '#38bdf8', borderRadius: 4 }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#64748b' }, grid: { display: false } },
            y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(100,116,139,0.2)' } }
          }
        }
      });
    }

    function initCalendar() {
      const calDiv = document.getElementById('calendar');
      if (!calDiv || typeof VanillaCalendar === 'undefined') return;
      calDiv.innerHTML = '';
      
      const popDates = workoutSets.map(s => s.date.split('T')[0]);

      const calendar = new VanillaCalendar('#calendar', {
        settings: {
          selected: { dates: popDates }
        }
      });
      calendar.init();
    }

    function sendTelemetry(action, payload = {}) {
      if (!GOOGLE_SCRIPT_URL || !currentUser) return;
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, userId: currentUser.pin, username: currentUser.name, ...payload })
      }).catch(e => {});
    }

    function toggleSettingsModal() { document.getElementById('settings-modal').classList.toggle('active'); }
    function changeTheme(theme) { document.body.setAttribute('data-theme', theme); }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ workoutSets, bodyRecords }));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `lift_lab_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    window.onload = function() {
      const savedName = localStorage.getItem('gym_user_name');
      const savedPin = localStorage.getItem('gym_user_pin');
      if (savedName && savedPin) {
        document.getElementById('user-nickname-input').value = savedName;
        document.getElementById('user-pin-input').value = savedPin;
        handleAuth();
      }
    };
  </script>
</body>
</html>
